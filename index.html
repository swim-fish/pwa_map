<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="A Taiwan-covering PWA showing a crosshair reticle with live multi-format coordinate readout."
    />
    <!-- vite-plugin-pwa injects the manifest <link> with the
         correct `${base}manifest.webmanifest` href. Writing one
         here statically would break under subpath publishing
         because Vite cannot rewrite a path to an asset that
         does not yet exist at build start. -->
    <title>Taiwan Coordinate Map</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
